version: 1
id_pattern: "[A-Z][A-Z0-9_]*-\\d+"
requirements:
  - docs/requirements/**/*.md
sources:
  - src/**/*.py
tests:
  - tests/**/*.py
junit:
  - reports/*.xml
rules:
  min_test_coverage: 100
  fail_on_unknown_ids: true
  fail_on_orphan_tests: false
  require_parent_for: [SRS]
report:
  out_dir: reqcov-report
  title: "Thermostat — Software Requirements Traceability"
